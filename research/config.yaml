      p_size: "c_band R against ITU-R P.838-3 (vertical, the band's median frequency) at 2, 5 and 10 mm/h, as a ratio, SIZE REFERENCE ONLY;
               flagged if a ratio is outside 0.5-2"
      p_ratio_flag: [0.5, 2.0]
