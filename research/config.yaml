      seed: 7201
    long_links:              # 7.3
      dry_path:
        window: "inside every link-event window (TRAIN and VAL V1): a dry start t0 = the start of a run of >= 2 consecutive 5 min bins in
                 which the radar path-MAX rain (release radar_along_links_5min R_max, every pixel on the path) is <= 0.05 mm/h both as it is
                 (V0) and divided by g_e (V1), and the City gauge of the link (if the link has one within 1 km) shows 0 in every minute
                 of those bins; the 60 min before t0 must hold >= 10 minutes with path-mean V1 >= 2 mm/h. The window lasts while the
                 path stays dry by the same rule (at most 60 min); one window per dry start"
        measured: "W_obs(t) = A(t) - c (1 min A of the dataset, valid minutes) at t minutes after t0"
        model: "W_mod(t) = the frozen model's W alone (path term set to 0, c = 0), forward simulated at 1 min with the same a_link and the same
                V1 rain history"
        at_min: [5, 10, 20, 40]
        stats: "per length class and band: windows, links, events; median W_obs, W_mod and the error W_obs - W_mod at 5, 10, 20, 40 min (windows
                still dry at t), 90 % event-bootstrap intervals (1000 draws, seed 7301)"
        decay: "per length class: the median over windows of W(t) / W(0..1 min mean) for t = 0-60 min (windows with W(0) >= 0.5 dB); the decay
                time = the exponential fitted to that median curve over 0-30 min (least squares on log, points > 0.05); measured and model,
                against 10.3 min; the share left at 40-60 min (mean of the median curve) = the slow store. Event-bootstrap intervals"
        min_w0_db: 0.5
        pass: "the L > 3 km class agrees with the L < 1 km class (the event-bootstrap interval of the difference of their median errors at 10 min
               contains 0) AND |median error at 10 min| <= 0.3 dB in every length class with >= 10 windows"
        max_err_10_db: 0.3
        min_windows: 10
        boot_reps: 1000
        seed: 7301
      paired:
        pairs: "TRAIN links of the datasets: a shared endpoint (the same release site id; sites are merged within their max_member_offset_m), the
                same band, bearings from the shared site within 15 deg, L2 / L1 >= 1.5, L2 - L1 >= 1 km, and link-events in the same event"
        max_bearing_deg: 15
        min_ratio: 1.5
        min_dL_km: 1.0
        estimator: "W = (L2 A1 - L1 A2) / (L2 - L1) on A - c, per common 5 min bin"
        fake: "first: the noise of the estimator with a known truth (W = 1.5 dB, k = 0.5 dB/km): A_i = W + L_i k + the real candidate residual
               series of each link-event of the pair (aligned in time, so their correlation is kept); noise SD = the SD of the estimator
               minus the truth over the common rain bins (V1 >= 0.5 on both); per pair-event, then the median"
        not_testable: "if the median noise SD > 1 dB or there are < 5 pairs: 'not testable', no comparison is forced"
        max_noise_sd_db: 1.0
        min_pairs: 5
        compare: "otherwise: per rain class of V1 (the S3 classes) the median of W_pair (observed) - W_pair (the same estimator on the model
