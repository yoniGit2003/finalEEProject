# Settings for all research code: ONE file, one section per part of the research. Scripts read their section from
# here instead of hard-coding numbers, so every result can be traced to the settings that made it.

# Pinned data version for all research code (change only on purpose, and note it in the results).
release: openmrg_v1

# ---------------------------------------------------------------------------------------------------------------
# Current baseline method (research/baseline_estm/baseline.py, run_sample.py). Unit: hours and dB.
# ---------------------------------------------------------------------------------------------------------------
baseline:
  version: v2          # v1 (first method, kept for comparison) or v2 (current); see baseline_estm/METHOD.md
  skip_h: 1.0          # usable dry slot: at least this long after the end of the last wet slot of the link
  min_dry_h: 1.0       # a window needs at least this much usable dry time, else fallback / "missing"
  excursion_db: 1.0    # window value further than this from the sub-link's summer dry median -> flag
  v1:
    window_h: 6.0      # before / after windows, MEAN of the 5 min tl_mean
    diff_db: 0.5       # |after - before| above this -> straight line (method B)
  v2:
    window_h: 24.0     # MEDIAN of usable dry 5 min tl_mean in the 24 h before the event start ...
    fallback_window_h: 48.0   # ... or in the 48 h before, if the 24 h window has < min_dry_h; else missing
    humidity_exclusion: false # drop dry slots in dew-risk hours; NOT adopted by the R1b rule (p90 |offset| at humid
                              # starts 0.392 -> 0.408 dB, i.e. worse; see outputs/reports/R1b_validation.md)
  dew:
    rh_pct: 90.0       # dew risk: RH >= this ...
    dpd_c: 2.0         # ... or dew-point depression (T - Td, Magnus) < this
    window_share: 0.25 # flag dew_risk_in_window if more than this share of the window's dry slots is at dew risk
    night_sun_elev_deg: -0.833  # night: sun centre below this elevation (standard sunrise / sunset) at mid-hour
    site_lat: 57.7089  # Gothenburg
    site_lon: 11.9746
  daily_cycle_large_db: 0.4   # flag daily_cycle_large if the R1 C3 amplitude of the sub-link is above this
  sample:              # the first sample run (run_sample.py)
    links_per_class: 3
    seed: 0

# ---------------------------------------------------------------------------------------------------------------
# R1: validation of the baseline (research/baseline_estm/validation/). Measures only; does not change the method.
# ---------------------------------------------------------------------------------------------------------------
baseline_validation:
  seed: 42
  sample: FULL                    # FULL = all good train sub-links; DEV = the 24 sub-links below (quick runs)
  dev_sublinks: ["10011_1", "10011_2", "10025_1", "10025_2", "10116_1", "10116_2", "10155_1", "10155_2",   # quoted:
                 "10206_1", "10206_2", "10215_1", "10215_2", "10267_1", "10267_2", "10281_1", "10281_2",   # YAML reads
                 "10310_1", "10310_2", "10320_1", "10320_2", "10324_1", "10324_2", "10338_1", "10338_2"]   # 10011_1 as a number
  skip_h: 1.0                     # default skip S
  variants:                       # all use only dry, non-skipped slots
    M1_window_h: 24               # M1 rolling median before t0
    M2_window_h: 6                # M2 (mean) / M2b (median) before t0
    min_dry_h: 1.0                # M1, M2, M2b, M3: missing if less usable dry time in the window
  c1:                             # fake events in certified dry weather (truth A = 0)
    durations_h: [1, 3, 6, 12, 24, 40]
    max_events_per_sublink: 20
    time_bins_h: [0, 1, 3, 6, 12, 24, 40]
    short_max_h: 6                # "D <= 6 h"
    long_h: 24                    # "D = 24 h"
  c2:                             # does the after window carry a drying signal?
    k_h: [1, 2, 3, 6, 12, 24]
    level_window_h: 1.0
    min_dry_level_h: 0.5
  c3:                             # daily cycle in dry weather
    anomaly_window_h: 24          # centred window for the local median
    anomaly_min_slots: 24         # at least 2 h of dry slots in that window
    amplitude_thresholds_db: [0.2, 0.4]
    n_typical: 3
    n_largest: 3
  c4:                             # dry-day jumps
    excess_db: 1.0
    min_duration_h: 3.0
    max_gap_min: 15
    overlap_share: 0.5
    neighbour_km: 5.0
    high_rh_pct: 90
  c5:                             # the flagged cases of the sample run
    plot_before_h: 12
    plot_after_h: 24
    after_met_h: 6                # humidity / dew-point depression averaged over this long after the rain
    high_delta_db: 0.5            # "high" after the rain: Delta at k = 1 h at least this
    shrink_share: 0.5             # "shrinks": Delta at the last k >= 6 h below this share of Delta at k = 1 h
  c6:                             # sensitivity of M2b
    durations_h: [1, 6, 24]
    window_h: [3, 6, 12, 24]
    skip_h: [1, 3, 6]
    stats: [mean, median]
  r1b:                            # event-level validation of v2 (fixed before the run)
    humid_start_rh_pct: 90        # humid start: RH >= this at t0
    adopt_min_gain_db: 0.05       # adopt the humidity exclusion if p90 |offset| at humid starts improves by >= this
    adopt_max_missing_rise: 0.02  # ... and the overall missing share rises by <= this (2 percentage points)
    pass_fail:                    # per good train sub-link, offsets of v2 as adopted
      median_abs_db: 0.1          # |median offset| at D <= 6 h
      p90_abs_db: 0.25            # p90 |offset| at D <= 6 h
      extra_p90_24h_db: 0.15      # p90 |offset| at 24 h minus at D <= 6 h
  pass_fail:                      # R1 (slot level), fixed before seeing results
    median_abs_db: 0.1
    p10_min_db: -0.3
    p90_max_db: 0.3
    extra_p90_24h_db: 0.2

# ---------------------------------------------------------------------------------------------------------------
# WAA stage (research/WAA_estm/). Step 1 = extract ALL drying tails (no selection, no fitting). Unit: minutes and dB.
# ---------------------------------------------------------------------------------------------------------------
waa:
  tails:                     # tail definition (README.md of WAA_estm): t0 = last_wet_end of baselines.csv
    cap_h: 12.0              # t_end at the latest t0 + cap_h
    gap_min: 15              # ... or at the start of a NaN run of 1 min A this long or longer
    gauge_max_dist_m: 1000   # gauge columns only if the link's nearest gauge is this close (as link_state)
  report:                    # descriptive only (step1_tails.md); nothing here selects tails
    a_start_bins_db: [0.5, 1.0, 2.0]          # A_start bins: < 0.5, 0.5-1, 1-2, > 2 dB
    return_minutes: [2, 5, 10, 30, 60, 180]   # "back to the dry level" checked at these minutes since t0
    return_floor_db: 0.3                      # threshold = max(return_floor_db, return_std_factor * offset_std)
    return_std_factor: 2.0
    rise_db: 0.3             # dry-weather rise: smoothed A goes up by this much above its running minimum ...
    rise_smooth_min: 15      # ... smoothed with a rolling median of this many minutes, while link_state is dry
    resolution_panels: 12    # resolution check: random tails with A_start >= resolution_min_a_start_db
    resolution_min_a_start_db: 1.0
    resolution_hours: 2.0
    seed: 0
  selection:                 # step 2 (step2_select_tails.py): rules fixed BEFORE looking at the results; TRAIN only
    max_nan_share: 0.10      # exclude a tail if more than this share of its minutes has no A
    rise_db: 0.6             # truncate at a sustained dry-weather rise: smoothed A >= this above its running minimum
    rise_smooth_min: 15      #   (trailing rolling median, minutes; running minimum since t_first_dry, dry minutes)
    rise_min_duration_min: 30   #  ... held for at least this many consecutive minutes
    main_a_start_db: 1.0     # main set: A_start >= this ...
    alt_a_start_db: 0.6      #   (alternative threshold, counts only)
    min_usable_min: 60       # ... and usable length t0 .. t_use_end >= this
    control_max_a_start_db: 0.5   # control group: A_start below this, same exclusions
    a_dry_window_min: 5      # A_dry = mean A over [t_first_dry, t_first_dry + this)
    value_window_min: 5      # A at t0 + k = mean over [k, k + this)
    shape_minutes: [10, 30, 60, 180, 360]
    crossing_smooth_min: 5   # time to A_start / 2 and A_start / e on a trailing mean of this many minutes
    plateau_band_db: 0.15    # plateau: A stays within this band ...
    plateau_min_duration_min: 45   # ... for at least this long ...
    plateau_min_a_db: 0.6    # ... while A stays above this
    pair_minutes: [60, 180]  # sub-link 1 vs 2: A at t0 + these minutes
    length_bins_km: [0.1, 0.5, 1, 2, 3, 5, 8, 16]
    bootstrap_reps: 1000     # Spearman 95 % CI: resample LINKS with replacement
    seed: 0
    gallery_n: 24
    gallery_seed: 1
    gallery_hours: 6
  selection_2b:              # step 2b (step2b_fix_tails.py): fixes after the step 2 gallery; TRAIN only, no fitting
    gauge_max_dist_m: 1000   # rain trace: radar R_max > 0 on the path OR any gauge within this distance > 0 (5 min bin)
    rise_quiet_db: 0.15      # dry-rise cut moved back to the last minute before the rise run with excess < this
    max_offset_std_db: 0.3   # noise exclusion: sub-link offset_std (dry-weather baseline spread) above this (1 RSL step)
    late_from_h: 6           # late_level = median A over [t0 + late_from_h, t0 + late_to_h] ...
    late_to_h: 12
    late_min_valid_min: 60   # ... if the lenient tail has at least this many valid minutes there
    level_floor_db: 0.3      # level_shift if |late_level| > max(level_floor_db, level_std_factor * offset_std)
    level_std_factor: 2.0
    undershoot_window_h: 3   # undershoot = min of the 15 min trailing median of A within this long after t0_trace
    undershoot_db: -0.3      # flag if below this
    temp_before_h: 2         # temperature change = T(hour of t0) - T(hour of event start - this)
    example_panels: 6        # example panels per flag
    example_seed: 3
    gallery_n: 24
    gallery_seed: 2
    gallery_hours: 6
  freeze:                    # step 2c (step2c_freeze.py): last fixes, then the frozen tail set for modelling
    tail_set: v1             # id written into every frozen file (file names carry no version: ORGANIZATION.md)
    radar_nan_is_unknown: true   # a radar NaN bin on the path counts like a rain trace (start and strict end)
    rise_smooth_min: 10      # rise cut v2: trailing median of A over this many minutes ...
    rise_db: 0.6             # ... >= this above its running minimum since t0_trace, on ALL minutes ...
    rise_min_duration_min: 10    # ... for at least this many minutes
    rise_quiet_db: 0.15      # cut at the last minute before that run with an excess < this (that minute is kept)
    event_window_after_h: 6  # event diagnostics: radar valid fraction over [event start, event end + this]
    event_rise_heavy_share: 0.3  # flag an event if more than this share of its tails is cut by the rise rule
    look_events: [E20150617_0705, E20150701_0030]
    look_tails_per_event: 6
    look_seed: 4
    look_hours: 6
