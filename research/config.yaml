      boot_reps: 1000
      seeds: {rho: 7101, w_height: 7102}
    short_links_val:         # 7.2, frozen fits on VAL V1
      rmse: "RMSE of the 5 min A (valid bins) per length class, per band and per rain class (V1 of the bin: < 0.1, 0.1-2, 2-5, 5-10, >= 10 mm/h),
             VAL and TRAIN (TRAIN in-sample), with VAL event-bootstrap intervals (1000 draws, seed 7201)"
      rule: "every length class and every band: VAL RMSE <= 1.15 x the all-class VAL RMSE. The rain classes are compared with TRAIN
             (VAL / TRAIN <= 1.15, information): heavier rain always has larger errors, so the all-class rule does not apply to them"
      rmse_factor_max: 1.15
      rain_classes_mmh: [[0, 0.1], [0.1, 2], [2, 5], [5, 10], [10, 1000]]
      length_test: "the VAL V1 length test through the model (S3b rule), at least 4 of 6 cells"
      shape: "short links (L < 1 km) on VAL, per band: the candidate (shared shapes) against the band-specific S5a free fit (frozen); the shared
              shape must not be worse by more than 0.003 dB in any band (the S6 rule)"
      shape_rise_max_db: 0.003
      after_rain: "the median residual (A - A_pred, 5 min) against the minutes after the link's last wet bin, 10 min bins 0-180 min, per length
                   class, VAL and TRAIN (information: the slow-tail error in dB)"
