      same_layer: "Spearman across links between the median dew peak excess of a link and its log a_link, 90 % link-bootstrap interval (seed 7401)"
      before_rain: "per link-event (TRAIN and VAL): dew before the rain = at least 4 of the 6 hours before the link's first wet bin are dew-risk hours
                    (research/baseline/outputs/products/dew_risk_hourly.csv, the same rule), and the path was dry in those 6 h (radar R_max
