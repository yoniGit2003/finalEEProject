              class, event bootstrap 1000, seed 95) on TRAIN V1 twice: links with L < 3 km only and links with L > 1.5 km only. The same two
              fits on the predictions of both frozen models (information)"
        short_max_km: 3.0
        long_min_km: 1.5
        cells: "the (band, rain class) cells where both fits exist (>= 10 link-events, >= 3 distinct L)"
        pass: "the 90 % intervals of I overlap in at least two thirds of the cells (at least 4 of 6; k of n = ceil(2 n / 3))"
      f_form: "say plainly whether the dry-path windows after heavy rain (>= 10 min of V1 >= 10 mm/h in the 60 min before t0), the intercepts of
               the 10-20 mm/h class or the paired links separate the candidate F (free knots, flattening above 20 mm/h) from the closed F
               (R / 5)^0.47: the observed number must fall inside its interval for one description and outside for the other.
