               'F and P' (plug_shared_FP_F_and_P.pkl). Every cheap check is run for both F descriptions; the verdicts are those of the candidate"
    data: "the S3 all-length datasets with input V1 (TRAIN: research/.cache/wet_antenna/final_s5a/data_train_v1.npz, 9780 link-events;
           VAL: data_val_all.npz divided by the S4.3 path-mean g_e of its event). VAL numbers are labelled 'used (optimistic)'"
    val_label: "used (optimistic)"
    length_classes_km: [[0, 1], [1, 3], [3, 100]]
    length_test_share: "at least 4 of 6 cells (decision 2026-10-19); with n eligible cells: at least ceil(2 n / 3)"
    w_independent_of_L:      # 7.1
      variables: "per link (a_link is one number per link, so the direction of a sub-link does not apply): L_km, frequency_ghz, mean antenna
                  diameter of the two ends (sub-link metadata), orientation (bearing of the path, 0-180 deg, from the site coordinates; tested as
                  |sin| and |cos| of the bearing), polarization (v / h, only 2 links h: information), the site (Kruskal-Wallis over the sites with
                  >= 3 TRAIN links at one end), n_radar_cells; the metadata has no antenna type, radome or height"
      test: "Spearman rho of log a_link against each numeric variable, 90 % link-bootstrap interval (1000 draws, seed 7101), the p-value of
             Spearman (Kruskal-Wallis for the site); BH q = 0.10 over all variables"
      w_height: "per link the candidate's equilibrium W height a_link F_band(R) at R = 2 and 5 mm/h; per length class the median over links with
                 a 90 % link-bootstrap interval (1000 draws, seed 7102); also per band and length class (information: the band mix differs by length)"
      pass: "no |rho| >= 0.3 with an interval that excludes 0 for L, AND at both rain rates the three length classes overlap pairwise in W height.
