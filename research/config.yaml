      source: "the dew-suspect list in the repo: research/baseline/outputs/products/dry_jumps.csv (baseline module, make_dew_products.py: the R1 C4
               dry-day level jumps of every TRAIN sub-link with the SMHI GbgA weather of the jump), the positive jumps of the S7 links with
