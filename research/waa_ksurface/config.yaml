# Settings of the waa_ksurface branch (Block A). The Part 1 settings stay in research/config.yaml and are read, never changed.
release: openmrg_v1

a1:
  expect: {links: 206, link_events: 9780}       # the gate of A1a (Part 1: tighten_s6_lengths.csv)
  tolerance: 0.01                               # A1b: largest allowed difference of I (dB) and s (dB/km)
  length_classes_km: [[0, 1], [1, 3], [3, 100]]
  rainy_mmh: 0.3                                # a "rainy" 5 min bin: R >= this (the Part 1 wet threshold of the length test)
  extra_classes_mmh: [[0.1, 0.25], [0.25, 0.5]] # the two classes A3a may add

a3:                                             # SUPERSEDED by the Detachment correction (2026-11-11): read only by the superseded a3 scripts
  classes_mmh: [[0.1, 0.25], [0.25, 0.5], [0.5, 1], [1, 2], [2, 5], [5, 10], [10, 20]]
  boot_reps: 200                                # event-bootstrap draws (rule A3a)
  seed: 95                                      # the Part 1 seed of the length test
  interval: [5, 95]
  durations_min: [5, 15, 30, 60]                # (b) at least this long in the same rain class
  duration_test: [30, 5]                        # (b) the paired difference I(30) - I(5)
  duration_share: 0.25                          # (b) the rule fires if the interval excludes 0 in MORE than this share of the eligible cells
  eiv:                                          # (d) the errors-in-variables fake check
    truth:                                      # the Part 1 closed forms (waa_equation_final.json), known and independent of A3
      A_band_db: {"28 GHz": 2.57, "38 GHz": 2.77}
      b: 0.542
      c_band: {"28 GHz": 0.105, "38 GHz": 0.194}
    a_sd: 0.19                                  # sd of ln a_link (Part 1: 80 % of links within 0.77-1.24)
    noise_sd_db: 0.2                            # white noise per 5 min value
    pixel_km: 2.0                               # n_pix = max(1, L / pixel_km)
    min_rain_mmh: 0.5                           # the radar-vs-gauge scatter is measured where both are >= this
    reps: 20
    seed: 311
    pass: {intercept_db: 0.15, slope_rel: 0.20}
  grid: {r_min: 0.01, r_max: 60.0, n: 400}      # the dense R grid of the curve product (plus R = 0)

e1:                                             # the radar rain error (rules dated 2026-11-11 in decisions.md, step E1)
  log_min_rain_mmh: 0.5                         # log statistics use bins where every sensor reads at least this
  linear_min_any_mmh: 0.1                       # linear triple collocation: bins where any sensor reads at least this
  class_edges_mmh: [0.1, 0.2, 0.5, 1, 2, 5, 10, 20]
  boot_reps: 200
  seed: 411
  interval: [5, 95]
  triplets:                                     # name: [radar pixels (gauge names), gauge a, gauge b]
    T1: [[GbgA], Drakeg, GbgA]
    T2: [[GbgA], Lbom, GbgA]
    T3: [[Drakeg, Lbom], Drakeg, Lbom]
    T4: [[Jarn, Askim], Jarn, Askim]
  pairs_min_bins: 30                            # a pair statistic needs at least this many bins with rain at both gauges
  pairs_fit_max_km: 8.0                         # the line through the semivariance uses the pairs up to this separation
  pixel_mean_distance_km: 1.04                  # mean distance between two random points of a 2 km square (0.5214 x 2)
  scale_min_gauge_mm: 1.0                       # an event (or a gauge in an event) enters the scale part with at least this much gauge rain

ltest:                                          # the length test of this branch (derived in decisions.md, step E3; nothing from Part 1)
  class_edges_mmh: [0.1, 0.2, 0.5, 1, 2, 5, 10, 20]   # equal steps in log R (1-2-5 series)
  rules:                                        # steady rain: every bin of the t_pre_min before the bin within [R / q, R * q]
    R1: {t_pre_min: 20, q: 2.0}                 # tried first (keeps more data)
    R2: {t_pre_min: 30, q: 1.5}
  huber_k: 1.345                                # standard constant: 95 % efficiency for normal errors
  min_events: 5                                 # a cell is fitted with values from at least this many events
  short_km: 1.0                                 # the shortest length class of the data layer
  n_short_floor: 5                              # n_short = max(this, ceil((sigma_link / tolerance)^2))
  tolerance_db: 0.15                            # the intercept tolerance of the fake tests
  boot_reps: 200
  seed: 95
  interval: [5, 95]

fake:                                           # the fake world (decisions.md, steps E3 and E2): generic truth, round numbers
  truth:
    f_top_db: 3.0                               # F_true = 3 R / (R + 2) dB
    f_half_mmh: 2.0
    p_per_mmh: {"28 GHz": 0.1, "38 GHz": 0.2}   # P_true = 0.1 R and 0.2 R dB/km
    tau_wet_min: 5.0                            # one store: 5 min while W is below its target,
    tau_dry_min: 15.0                           #            15 min while above
  rain_error:                                   # the E1 measurement (outputs/tables/e1_rain_error_synthesis.csv)
    sigma_lo: 0.48
    sigma_hi: 0.87
    scale_sd: 0.43                              # scale part left after g_e, per link-event
    shared_share: 0.46                          # share of the per-bin variance shared by all links at one time
    rho: 0.35                                   # lag-1 correlation of the per-bin parts
  reps: 5
  seed: 700
  pass: {intercept_db: 0.15, slope_rel: 0.20, cells_may_fail: 1}
  correction: {iterations: 4, sims: 4, shrink_min: 0.2}   # candidate (iii)

t1:                                             # the conditional rain error (decisions.md, step T1)
  min_label_mmh: 1.0                            # windows with a radar label below this are not used (the gauge resolves too little)
  shared_share: 0.46                            # E1: share of the radar error shared in space
  min_windows: 30                               # (a) needs at least this many used windows
  min_events: 5                                 #     in at least this many events
  boot_reps: 200
  seed: 511
  interval: [5, 95]
  count_grid: [0.0, 0.05, 0.1, 0.2, 0.3, 0.48]  # (b) added per-bin error sd
  count_reps: 3

t3:                                             # E2 rerun at the conditional error (decisions.md, steps T2 and T3)
  sigma_c_lo: 0.18                              # T1: the link-independent window-level part, 5 % and 95 % of the event bootstrap
  sigma_c_hi: 0.26
  slow_error:
    event_sd: 0.45                              # T1: per-event scale part (shared by all links of the event)
    shared_share: 0.46                          # E1: share of the within-event error shared in space
    window_corr: 0.9                            # the error is this correlated over the 30 min of a window
  gauge:                                        # the fake world of candidate (iv), from E1
    own_sd_15min: 0.32
    variogram_slope_per_km: 0.0278              # 0.17^2 / 1.04 km
    rho: 0.35
    f15: 0.516
    rep_factors: [1.0, 2.0]                     # normal and pessimistic (doubled) representativeness
  min_reps_judged: 3
  adopt: {min_valid_cells: 8, min_valid_below_2mmh: 3}

e4:                                             # the per-link criterion (decisions.md, step E4, written before the run)
  link_sd_threshold_db: 0.15                    # a per-link factor is needed if the between-link sd is at least this
  p_threshold: 0.05                             # AND the permutation test gives p below this
  permutations: 1000
  seed: 811

a4:                                             # coverage of the (R, W) plane (decisions.md, step A4, written before the run)
  quant_step_db: 0.3                            # one RSL quantization step (W2)
  w_step_db: 0.3                                # W bins of one quantization step
  w_min_db: -0.3
  w_max_db: 9.0                                 # the plane ends here; minutes above are counted as outside
  min_events: 5                                 # event bootstrap: fewer than one of 200 draws leaves the cell empty
  delta_db: 0.0375                              # the mean W_hat of a cell known to 25 % of one step at two sd
