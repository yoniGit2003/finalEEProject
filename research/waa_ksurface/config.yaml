# Settings of the waa_ksurface branch (Block A). The Part 1 settings stay in research/config.yaml and are read, never changed.
release: openmrg_v1

a1:
  expect: {links: 206, link_events: 9780}       # the gate of A1a (Part 1: tighten_s6_lengths.csv)
  tolerance: 0.01                               # A1b: largest allowed difference of I (dB) and s (dB/km)
  length_classes_km: [[0, 1], [1, 3], [3, 100]]
  rainy_mmh: 0.3                                # a "rainy" 5 min bin: R >= this (the Part 1 wet threshold of the length test)
  extra_classes_mmh: [[0.1, 0.25], [0.25, 0.5]] # the two classes A3a may add

a3:                                             # SUPERSEDED by the Detachment correction (2026-11-11): read only by the superseded a3 scripts
  classes_mmh: [[0.1, 0.25], [0.25, 0.5], [0.5, 1], [1, 2], [2, 5], [5, 10], [10, 20]]
  boot_reps: 200                                # event-bootstrap draws (rule A3a)
  seed: 95                                      # the Part 1 seed of the length test
  interval: [5, 95]
  durations_min: [5, 15, 30, 60]                # (b) at least this long in the same rain class
  duration_test: [30, 5]                        # (b) the paired difference I(30) - I(5)
  duration_share: 0.25                          # (b) the rule fires if the interval excludes 0 in MORE than this share of the eligible cells
  eiv:                                          # (d) the errors-in-variables fake check
    truth:                                      # the Part 1 closed forms (waa_equation_final.json), known and independent of A3
      A_band_db: {"28 GHz": 2.57, "38 GHz": 2.77}
      b: 0.542
      c_band: {"28 GHz": 0.105, "38 GHz": 0.194}
    a_sd: 0.19                                  # sd of ln a_link (Part 1: 80 % of links within 0.77-1.24)
    noise_sd_db: 0.2                            # white noise per 5 min value
    pixel_km: 2.0                               # n_pix = max(1, L / pixel_km)
    min_rain_mmh: 0.5                           # the radar-vs-gauge scatter is measured where both are >= this
    reps: 20
    seed: 311
    pass: {intercept_db: 0.15, slope_rel: 0.20}
  grid: {r_min: 0.01, r_max: 60.0, n: 400}      # the dense R grid of the curve product (plus R = 0)

e1:                                             # the radar rain error (rules dated 2026-11-11 in decisions.md, step E1)
  log_min_rain_mmh: 0.5                         # log statistics use bins where every sensor reads at least this
  linear_min_any_mmh: 0.1                       # linear triple collocation: bins where any sensor reads at least this
  class_edges_mmh: [0.1, 0.2, 0.5, 1, 2, 5, 10, 20]
  boot_reps: 200
  seed: 411
  interval: [5, 95]
  triplets:                                     # name: [radar pixels (gauge names), gauge a, gauge b]
    T1: [[GbgA], Drakeg, GbgA]
    T2: [[GbgA], Lbom, GbgA]
    T3: [[Drakeg, Lbom], Drakeg, Lbom]
    T4: [[Jarn, Askim], Jarn, Askim]
  pairs_min_bins: 30                            # a pair statistic needs at least this many bins with rain at both gauges
  pairs_fit_max_km: 8.0                         # the line through the semivariance uses the pairs up to this separation
  pixel_mean_distance_km: 1.04                  # mean distance between two random points of a 2 km square (0.5214 x 2)
  scale_min_gauge_mm: 1.0                       # an event (or a gauge in an event) enters the scale part with at least this much gauge rain

ltest:                                          # the length test of this branch (derived in decisions.md, step E3; nothing from Part 1)
  class_edges_mmh: [0.1, 0.2, 0.5, 1, 2, 5, 10, 20]   # equal steps in log R (1-2-5 series)
  rules:                                        # steady rain: every bin of the t_pre_min before the bin within [R / q, R * q]
    R1: {t_pre_min: 20, q: 2.0}                 # tried first (keeps more data)
    R2: {t_pre_min: 30, q: 1.5}
  huber_k: 1.345                                # standard constant: 95 % efficiency for normal errors
  min_events: 5                                 # a cell is fitted with values from at least this many events
  short_km: 1.0                                 # the shortest length class of the data layer
  n_short_floor: 5                              # n_short = max(this, ceil((sigma_link / tolerance)^2))
  tolerance_db: 0.15                            # the intercept tolerance of the fake tests
  boot_reps: 200
  seed: 95
  interval: [5, 95]

fake:                                           # the fake world (decisions.md, steps E3 and E2): generic truth, round numbers
  truth:
    f_top_db: 3.0                               # F_true = 3 R / (R + 2) dB
    f_half_mmh: 2.0
    p_per_mmh: {"28 GHz": 0.1, "38 GHz": 0.2}   # P_true = 0.1 R and 0.2 R dB/km
    tau_wet_min: 5.0                            # one store: 5 min while W is below its target,
    tau_dry_min: 15.0                           #            15 min while above
  rain_error:                                   # the E1 measurement (outputs/tables/e1_rain_error_synthesis.csv)
    sigma_lo: 0.48
    sigma_hi: 0.87
    scale_sd: 0.43                              # scale part left after g_e, per link-event
    shared_share: 0.46                          # share of the per-bin variance shared by all links at one time
    rho: 0.35                                   # lag-1 correlation of the per-bin parts
  reps: 5
  seed: 700
  pass: {intercept_db: 0.15, slope_rel: 0.20, cells_may_fail: 1}
  correction: {iterations: 4, sims: 4, shrink_min: 0.2}   # candidate (iii)

t1:                                             # the conditional rain error (decisions.md, step T1)
  min_label_mmh: 1.0                            # windows with a radar label below this are not used (the gauge resolves too little)
  shared_share: 0.46                            # E1: share of the radar error shared in space
  min_windows: 30                               # (a) needs at least this many used windows
  min_events: 5                                 #     in at least this many events
  boot_reps: 200
  seed: 511
  interval: [5, 95]
  count_grid: [0.0, 0.05, 0.1, 0.2, 0.3, 0.48]  # (b) added per-bin error sd
  count_reps: 3

t3:                                             # E2 rerun at the conditional error (decisions.md, steps T2 and T3)
  sigma_c_lo: 0.18                              # T1: the link-independent window-level part, 5 % and 95 % of the event bootstrap
  sigma_c_hi: 0.26
  slow_error:
    event_sd: 0.45                              # T1: per-event scale part (shared by all links of the event)
    shared_share: 0.46                          # E1: share of the within-event error shared in space
    window_corr: 0.9                            # the error is this correlated over the 30 min of a window
  gauge:                                        # the fake world of candidate (iv), from E1
    own_sd_15min: 0.32
    variogram_slope_per_km: 0.0278              # 0.17^2 / 1.04 km
    rho: 0.35
    f15: 0.516
    rep_factors: [1.0, 2.0]                     # normal and pessimistic (doubled) representativeness
  min_reps_judged: 3
  adopt: {min_valid_cells: 8, min_valid_below_2mmh: 3}

e4:                                             # the per-link criterion (decisions.md, step E4, written before the run)
  link_sd_threshold_db: 0.15                    # a per-link factor is needed if the between-link sd is at least this
  p_threshold: 0.05                             # AND the permutation test gives p below this
  permutations: 1000
  seed: 811

a4:                                             # coverage of the (R, W) plane (decisions.md, step A4, written before the run)
  quant_step_db: 0.3                            # one RSL quantization step (W2)
  w_step_db: 0.3                                # W bins of one quantization step
  w_min_db: -0.3
  w_max_db: 9.0                                 # the plane ends here; minutes above are counted as outside
  min_events: 5                                 # event bootstrap: fewer than one of 200 draws leaves the cell empty
  delta_db: 0.0375                              # the mean W_hat of a cell known to 25 % of one step at two sd

a5:                                             # the model (decisions.md, step A5, written before the code was run)
  huber_delta_db: 0.3                           # one RSL quantization step (W2)
  r_knots_mmh: [0, 0.5, 2, 5, 20]               # ln k is linear in ln(1 + R) between these
  w_knots_wet_db: [0, 0.5, 1, 2]                # the A4 wetting domain ends at 2.1 dB
  w_knots_dry_db: [0, 0.5, 1, 2, 4, 9]          # the A4 drying domain ends at 9.0 dB
  f_knots_mmh: [5, 10, 20]                      # the extension of F above its valid range (3.2 mm/h), to the R edge of the domain
  p_knots_mmh: [2, 5, 10, 20]                   # the extension of P above its valid range (1.4 mm/h)
  tau_min_min: 0.3333333                        # 1 / k not below 20 s (one third of the 1 min step)
  tau_max_min: 600                              # nor above 10 h
  h_bound: 4.0                                  # |h(W)| <= this (a factor exp(4) on k)
  f_inc_max_db: 3.0                             # an F increment between two knots: 0 .. 3 dB
  p_inc_max_db_km: 6.0                          # a P increment between two knots: 0 .. 6 dB/km
  k_start_min: 10.0                             # starting value of 1 / k
  f_inc_start_db: 0.01                          # starting F extension: almost held
  maxiter: 300
  lambdas: [0.0001, 0.001, 0.01]                # smoothness penalty grid (chosen by CV)
  folds: 5                                      # grouped by event
  lag_grid_min: [0, 1, 2, 3, 4, 5]              # the rule for d
  select: {interval: [5, 95], boot_reps: 1000, seed: 905, margin_db: 0.005}   # margin: Deviation 5 (the B4 materiality margin)
  tests: {grad_tol: 1.0e-5, step_tol: 1.0e-9, ext_tol: 1.0e-9, n_link_events: 40, seed: 77}
  maxiter_fold: 150                             # a fold refit starts from the fit on all events

a6:                                             # fake-data recovery (decisions.md, step A6, written before any run)
  rain_1min: {sd: 0.3, rho: 0.7}                # lognormal AR(1) fluctuation of the true rain inside 5 min (generic)
  noise: {offset_sd_db: 0.136, link_sd_db: 0.088, white_1min_sd_db: 0.072, quant_step_db: 0.3}
  sigma_c: 0.26                                 # T1, the high end
  seed: 1200
  truths:
    a:     {kind: const, k_wet: 0.2, k_dry: 0.0666666667}
    a_lag: {kind: const, k_wet: 0.2, k_dry: 0.0666666667, d_true: 2}
    b:     {kind: const, k_wet: 0.2, k_dry: 0.0666666667, free_extension: true}
    c:     {kind: dry_w, k_wet: 0.2, k_dry0: 0.0333333333, w_scale_db: 1.0}          # k_dry = (1 + W) / 30
    d:     {kind: both_r, k0: 0.1, r_scale_mmh: 2.0}                                  # k_wet = 0.1 (1 + R/2), k_dry = 0.1 / (1 + R/2)
    d_high: {kind: both_r, k0: 0.1, r_scale_mmh: 2.0, r0_mmh: 3.2, true_rung: K0}   # k depends on R only above 3.2 mm/h (tests R2)
    e:     {kind: two_store, phi: 0.5, k_fast_wet: 0.2, k_fast_dry: 0.1, k_slow: 0.0166666667}
    f:     {kind: const, k_wet: 0.2, k_dry: 0.0666666667, ghost: {events: 3, rain_mmh: 1.0, minutes: 30}}
    g:     {kind: const, k_wet: 0.2, k_dry: 0.0666666667, link_sd_db: 0.24}
  judge: {within: 0.25, min_share: 0.8}
  extension: {f_start_inc_db: 0.01, p_start_share: 0.5, at_zero_truth_above: 0.05}
  flag: {a0_min_db: 0.6, fall_db: 0.15, min_link_events: 5, share: 0.5}
  after_rain: {minutes: 30, match_db: 0.15}
  gate: {tau_wet_min: [2.5, 5.0, 10.0], margin_db: 0.005}   # Deviation 6: 1 / k_wet held at half / the truth / twice the truth
  detect: {sizes: [1.0, 0.5, 0.25, 0.1], replicates: 5, r_cap_mmh: 3.2}   # detectability (A6 final): sizes from the largest; detected = 4 of 5
  seed_final: 2200                              # Deviation 7: fresh fake data for every verdict

s1:                                             # signal against spurious gain under targeted losses (decisions.md, S1, written before any run)
  seed: 3200                                    # fresh fake data: seed + 10 x (position of the truth) + replicate
  truths: [a, c, c_r5, c_r10]                   # c_r5, c_r10: the k_dry(W) family at k(W = 2 dB) / k(W = 0) = 5 and 10 (only if nothing separates)
  replicates: 5
  dry_bins: 24                                  # L-dry: up to 120 min after the last wet bin
  dry_below_mmh: 0.1                            # the path is dry: radar input below the wet threshold of the data layer
  high_db: 1.0                                  # L-dryhigh: measured A - c of the first dry bin at least this
  radar_scale_added: 2.5                        # the radar of the g_e = 1 events against the gauges (E1)

s3:                                             # step 3 under Deviation 9 (decisions.md, written before the code)
  seed: 3300                                    # fresh fake data: seed + position of the truth; detectability as in A6 final with this base
  loss: L-dryhigh                               # the adopted loss and variant of S1; the margin is read from the S1 table
  variant: extended

s3b:                                            # step 3b: Deviations 12 (tail flag in the procedure) and 13 (B3'), decisions.md, written before the code
  seed: 3600                                    # fresh: runs a, c, d, d_high, e, f, g = seed + position; B3' replicates 1-4 of c / e = seed + 20 / 30 + r
  b3_replicates: 5                              # replicate 0 of c and of e = the run of Deviation 12
  detect_sizes: [1.0, 0.5, 0.25]                # a: ratio k(W = 2 dB) / k(W = 0) = 1 + 2a = 3, 2, 1.5; a = 1 is truth (c) itself
  min_free_start_gb: 4.0                        # the run does not start with less free memory
  min_free_gb: 2.0                              # below this a child is not started (or the largest peak so far, if larger)
  memory_log_minutes: 10

s3c:                                            # step 3c: fake runs of the A7 procedure (Deviation 14, decisions.md, written before the code)
  seed: 3800                                    # fresh: g_088 = seed, g_150 = seed + 1; detectability = seed + 10 + 10 x (position of a) + replicate
  loss: L-dryhigh                               # the adopted loss; the margin is read from the S1 table
  variant: current                              # Deviation 14: the 14 learning events only (margin 0.00291 dB)
  detect_sizes: [0.25, 0.5, 1.0]                # ratio k(W = 2 dB) / k(W = 0) = 1 + 2a = 1.5, 2, 3
  replicates: 5                                 # five per ratio, no early stop
  min_free_start_gb: 1.5                        # execution setting (user, 2026-11-18): the run does not start with less free memory
  min_free_gb: 1.5                              # execution setting (user, 2026-11-18): no child is started with less free memory
  memory_log_minutes: 10                        # the memory log, every 10 min

s3d:                                            # step 3d: the A7 procedure with 1 / k_wet fixed (decisions.md, written before the code)
  seed: 3840                                    # fresh: (a) r0, r1 = 3840, 3841; (c) r0, r1 = 3842, 3843
  replicates: 2
  tau_wet_min: [2.5, 5.0, 10.0]                 # 1 / k_wet held at these values (R3 revised); A7 uses the same list
  min_free_gb: 1.5                              # execution setting of step 3c (user, 2026-11-18)

a7:                                             # A7, the real fit (decisions.md, pre-registration, commit bbb5d2f)
  boot_draws: 200                               # event-bootstrap draws (plan.md)
  boot_seed: 3900                               # the same draws at every value of 1 / k_wet
  w_report_db: [0.0, 0.5, 1.0, 2.0]             # 1 / k_dry reported at these W (dB)

a7r:                                            # review of A7 (decisions.md, "Review of A7: the five checks", logged before the run)
  sel_draws: 50                                 # selection bootstrap: the first 50 A7 draws per estimate (user, 2026-11-21)
  block: 10                                     # draws per child process
  reproduce_rtol: 1.0e-9                        # sel_mid must reproduce the A7 drying table to this relative tolerance, else STOP
  f_ends: {flo: I_lo, fhi: I_hi}                # rule A3f: F through the 5-95 % bootstrap ends of the E4 cells
  dry_lags_min: [5, 10, 20, 30]                 # (5) the bin that ends this many minutes after the path went dry
  rain_before_min: 10                           # (5) at least this many minutes with radar input >= dry_below_mmh before
  min_free_gb: 1.5                              # execution setting of step 3c
a7d:                                            # diagnostic of the dry-path conflict (decisions.md, logged before the run)
  lags_min: [5, 10, 15, 20, 25, 30]             # the bins ending this many minutes after the path went dry
  early_min: [5, 10, 15]                        # bins of the early-half fit of ln(A - c)
  late_min: [15, 20, 25, 30]                    # bins of the late-half fit
  min_level_db: 0.15                            # measured A - c above this in every bin of the window
  class_db: 1.0                                 # start-level classes: first dry bin >= / < this
  boot_reps: 1000
  boot_seed: 3901
a7c:                                            # control for the within-window ratio (decisions.md, logged before the run)
  truths:                                       # K0 truths: the two A7 K0 pairs (gauge / radar k_wet estimate)
    G: {tau_dry_min: 8.88, tau_wet_min: 1.74, seed: 3920}
    R: {tau_dry_min: 13.22, tau_wet_min: 10.92, seed: 3921}
a8:                                             # step 8, naming the drying law (decisions.md, logged before the run)
  grid_lo_db: 0.01                              # the W grid of a tabulated form: 0 and grid_points geometric points lo .. hi
  grid_hi_db: 9.0                               # = the A4 drying domain edge (held above, as K1)
  grid_points: 60
  grid_w0_db: 1.0e-6                            # the table value at W = 0 is the form here
  fd_step: 1.0e-6                               # central difference step of the table in theta (times max(1, |theta|))
  lsq_max_nfev: 5000
  aicc_within: 2.0                              # "within 2 AICc of the best but with fewer parameters wins"
  dmax_try: 10.0                                # candidates with Delta_max above this are not tried in the plug-back
  max_trials: 6
  pysr: {seeds: [0, 1, 2, 3, 4], maxsize: 10, niterations: 100, populations: 15, timeout_s: 1800}
  boot_draws: 200                               # the A7 draws (seed 3900)
  boot_block: 20                                # draws per child process
  reproduce_rtol: 1.0e-9                        # the code checks (references, band) against the stored A7 / review numbers
  min_free_gb: 1.5                              # execution setting of step 3c
a8x:                                            # naming cross-check (decisions.md, logged before the run)
  min_free_gb: 1.5
  bms:
    prior_file: nv1.np5.dat                     # the shipped prior nv1.np5 (2017-10-18), renamed: its name has ':' (not valid on Windows)
    npar: 5                                     # a size-10 expression in one variable holds at most 5 constants
    ops: {"+": 2, "*": 2, "/": 2, "**": 2, "exp": 1, "-": 1}   # BMS's '-' is unary: + and - give subtraction
    max_size: 10
    seed: 0
    burnin: 1000
    steps: 3000
    top: 5
a8o:                                            # offset check (decisions.md, "Offset check", logged before the run)
  seed: 4200                                    # fresh: r0..r4 = 4200..4204; the offset draw of a seed uses the stream (seed, 1)
  replicates: 5
  tau_dry_min: 9.7                              # truth K0: step 8's plateau at the radar estimate
  tau_wet_min: 10.92                            # the radar-input estimate of 1 / k_wet (as the control's truth R)
  form_name: pysr_gauge_c8                      # step 8's accepted form, from the step 8 rank cache (read only)
  w_half_range_db: [0.2, 0.4]                   # reading: floor if K1 in >= 3 of 5 and the median W_half (K1 seeds) is in this range
  k1_min: 3
  k0_min: 4                                     # the non-exponential claim stands if K0 in >= 4 of 5
b_val:                                          # Block B (docs/waa_ksurface/block_b_prereg.md, frozen in 37470fa)
  seed: 4100                                    # M1 / M2: the paired event bootstrap, the same draws for every model
  boot_reps: 1000
  interval: [5, 95]
  m2_lags_min: [5, 10, 20]                      # M2: the bin ending 5 / 10 / 20 min after the path went dry
  m2_rain_before_min: 10                        # M2: at least 10 wet minutes before (review check (5))
  recipe_maxiter: 1000                          # the two recipes: L-BFGS-B
  reproduce_rtol: 1.0e-9                        # pre-VAL check: ours reproduces its step 8 training loss on TRAIN
  p1_rmse_tol_db: 0.0005                        # pre-VAL check: the Part 1 wrappers reproduce Part 1's TRAIN RMSE table (rounded to 4 decimals)
w_cv:                                           # WAA-only comparison (decisions.md, logged before any code was run)
  seed: 4400                                    # the paired event bootstrap over the 14 events, the same draws everywhere
  boot_reps: 1000
  interval: [5, 95]
  maxiter: 300                                  # L-BFGS-B of Part 1, Schleiss, Pastorek (finite-difference gradients)
  path_b_c_band: {"28 GHz": 0.10485503549708686, "38 GHz": 0.1943952690537487}   # Part 1's c_band (waa_equation_final.json)
  ours: {tau_wet_min: 10.922991180720075, form_name: pysr_gauge_c8}             # k_wet held at the frozen radar-input value
  part1: {phi: 0.72, tau_s_min: 240.0}          # held (not identified in Part 1)
  schleiss: {wet_mmh: 0.1}
  pastorek: {d: 0.1}
  a_prior_sd: 0.5                               # the a_link ridge of Part 1
  log_a_bounds: [-3.0, 3.0]
  after_lags_min: [5, 10, 20]
  rain_before_min: 10
  peak_min_db: 2.0
  dry_min_bins: 6                               # figures: at least 30 min after the last wet bin
  wet_mmh: 0.1                                  # figures: shading where R > 0.1 mm/h
  min_free_gb: 1.5
w_light:                                        # light-rain overestimate diagnostic (decisions.md, logged before any code was run)
  seed: 4500
  boot_reps: 1000
  interval: [5, 95]
  classes_mmh: [[0.1, 0.2], [0.2, 0.5], [0.5, 1.0], [1.0, 2.0], [2.0, 5.0]]   # half-open [lo, hi)
  light_max_mmh: 1.0
  min_bins_per_le: 3                            # (1) a link-event enters a class with at least 3 scored bins in it
  huber_c: 1.345                                # (1) robust line: Huber tuning x MAD scale
  huber_iter: 50
  heavy_mmh: 2.0                                # (2) heavy rain
  tail_bins: 12                                 # (2) 60 min before
  w_low_db: 0.3                                 # (2) our WAA part below this
  short_km: 1.0                                 # (4)
  gauge_dry_mmh: 0.1                            # (4) gauge shows no rain
