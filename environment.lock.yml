# Exact versions of the packages this project uses, on the computer that produced the committed results
# (Windows 10, written 2026-10-12). Use it when a newer version gives different numbers:
#     conda env create -f environment.lock.yml      then      conda activate cmlpipe
# The normal, looser list is environment.yml. Packages that these pull in are not pinned.
name: cmlpipe
channels:
  - conda-forge
dependencies:
  - python=3.12.1
  - numpy=2.4.5
  - pandas=3.0.6
  - xarray=2026.9.0
  - netcdf4=1.7.4
  - pyyaml=6.0.3
  - pyproj=3.8.0
  - shapely=2.1.2
  - matplotlib=3.10.9
  - pyarrow=25.0.1
  - zarr=3.4.0
  - plotly=7.1.0
  - streamlit=1.65.0
  - pytest=9.1.1
  - nbformat=5.11.1
  - nbclient=0.11.0
  - ipykernel=7.4.0
  - scipy=1.17.1
  - numba=0.68.0
  - llvmlite=0.50.0
  - scikit-learn=1.9.1
  - pip
  - pip:
      - pysindy==2.1.0
      - pysr==2.7.0
      - juliacall==0.9.36
      - -e "./pipeline[dev,explorer,research]"
