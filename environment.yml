# From the repository root:  conda env create -f environment.yml  then  conda activate cmlpipe
# This also installs the cmlpipe package itself (editable) with everything the research scripts need
# (= pip install -e "pipeline[dev,explorer,research]"): conda runs the pip section below from the folder of this
# file (the repository root).
# environment.lock.yml lists the exact versions that produced the committed results.
# Versions tested on 2026-10-02 (Windows 10, Python 3.12). No dask: every reader slices before loading.
name: cmlpipe
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=2.0          # tested 2.4.5
  - pandas>=2.2         # tested 3.0.6
  - xarray>=2024.1      # tested 2026.9.0
  - netcdf4>=1.6        # tested 1.7.4
  - pyyaml>=6.0
  - pyproj>=3.6         # tested 3.8.0
  - shapely>=2.0        # tested 2.1.2
  - matplotlib>=3.8     # tested 3.10.9
  - pyarrow>=15         # tested 25.0.1 (Parquet tables of the release)
  - zarr>=2.18          # tested 3.4.0 (Zarr format 2 stores of the release)
  - plotly>=6.0         # tested 7.1.0 (explorer figures, cmlpipe.viz.explorer)
  - streamlit>=1.50     # tested 1.65.0 (the explorer GUI)
  - pytest>=8.0
  - nbformat
  - nbclient
  - ipykernel
  - pip
  - pip:
      - -e "./pipeline[dev,explorer,research]"
